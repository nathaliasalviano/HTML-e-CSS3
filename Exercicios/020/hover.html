<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        div:hover {
            background-color: rgba(137, 43, 226, 0.459);
        }

        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            background-color: white;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o texto</p>
    <div>
        Passe o mouse aqui
        <p>texto escondido</p>
    </div>
    
</body>
</html>
