<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1 { /* box level*/

            background-color: rgba(165, 42, 42, 0.479);
            height: 40px;
            width: 375px;
            

            border: 5px solid rgba(129, 33, 33, 0.479);

            padding: 10px 10px 10px 10px;

            margin: auto; 
        }
        a { /* inline level */

            border-width: 3px;
            border-color: red;
            border-style: solid;
            border-radius: 10px;

            padding-top: 7px;
            padding-left: 7px;
            padding-right: 7px;
            padding-bottom: 7px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafor também são exemplos de box-level. mas os <a href="#">links são exemplos de caixas inline-level.</a> Vamos ver como que isso funciona</p>
    
</body>
</html>
